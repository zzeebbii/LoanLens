name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one mid-flight: a half-published site is worse
# than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # The full gate, not just a build. A deploy that skips the checks is a deploy that can
      # publish a red build.
      - name: Verify
        run: npm run check

      - uses: actions/configure-pages@v6
        id: pages
        with:
          # Turns Pages on for the repository if it is not already, rather than failing the
          # deploy with a bare "Not Found" until someone visits Settings. The workflow already
          # holds `pages: write`, so this needs no extra permission and is a no-op once the
          # site exists.
          enablement: true

      - name: Build
        # `base_path` comes from configure-pages, so the asset URLs match wherever Pages
        # actually serves the site — including a user or organisation page served at the root.
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Add SPA fallback
        # Pages has no rewrite rules, so a refresh on /loans/<id> would 404. Serving the same
        # document as the 404 page hands the URL to the client-side router instead.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
