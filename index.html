<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Local-first insights, reports and charts for EURIBOR-linked home loans."
    />
    <title>LoanLens</title>
    <script>
      // Applied before first paint so the initial render never flashes the wrong theme.
      // Mirrors the logic in src/app/theme.ts — keep the storage key in sync.
      ;(() => {
        try {
          const stored = localStorage.getItem('loanlens.theme')
          const dark =
            stored === 'dark' ||
            ((stored === null || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch {
          /* private mode / storage disabled — fall back to the light palette */
        }
      })()
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
