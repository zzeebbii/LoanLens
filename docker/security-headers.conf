# Security headers, in a snippet because nginx cannot inherit them.
#
# `add_header` directives are inherited from an outer block ONLY while the inner block
# declares none of its own. Adding a single `add_header Cache-Control ...` to a location
# silently discards every header set on the `server` — so declaring these once at server
# level left the app with no CSP at all on `/`, on the SPA routes, or on the scripts,
# because each of those locations sets its own caching header.
#
# The `always` flag is unrelated to that rule: it controls whether the header survives on
# error responses, not whether it is inherited. Only an `include` in each location fixes it,
# so every location below that sets any header must include this file too.

# The app makes exactly one cross-origin request, to the ECB. Everything else is same-origin,
# so the policy can be tight. `unsafe-inline` on scripts is needed for the pre-paint theme
# bootstrap in index.html, and on styles for the chart fills that carry a computed colour.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://data-api.ecb.europa.eu; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
