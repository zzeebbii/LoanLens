server {
  # Above 1024 so nginx can run as an unprivileged user.
  #
  # IPv6 is listed explicitly rather than left to the base image's
  # `10-listen-on-ipv6-by-default.sh`, which cannot rewrite a root-owned config once we have
  # dropped to the nginx user — it fails with a "read-only file system?" guess and moves on.
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Every location that sets a header of its own must re-include the security headers, or it
  # loses all of them. See the comment in security-headers.conf.
  include /etc/nginx/snippets/security-headers.conf;

  # Client-side routing: any path that is not a real file is the app, which then reads the
  # URL itself. Without this, a refresh on /loans/<id> is a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed assets are immutable — the filename changes when the content does.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The rate snapshot is not hashed and is refreshed on a schedule, so it must be revalidated
  # rather than held for a year.
  location = /data/euribor.json {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  # index.html must never be cached: it is what points at the current asset hashes.
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store";
  }

  gzip on;
  gzip_types application/javascript application/json text/css image/svg+xml;
  gzip_min_length 1024;
}
