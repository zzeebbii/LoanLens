server {
  # Above 1024 so nginx can run as an unprivileged user.
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Client-side routing: any path that is not a real file is the app, which then reads the
  # URL itself. Without this, a refresh on /loans/<id> is a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed assets are immutable — the filename changes when the content does.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The rate snapshot is not hashed and is refreshed on a schedule, so it must be revalidated
  # rather than held for a year.
  location = /data/euribor.json {
    add_header Cache-Control "no-cache";
  }

  # index.html must never be cached: it is what points at the current asset hashes.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  gzip on;
  gzip_types application/javascript application/json text/css image/svg+xml;
  gzip_min_length 1024;

  # The app makes exactly one cross-origin request, to the ECB. Everything else is
  # same-origin, so the policy can be tight. `unsafe-inline` on scripts is needed for the
  # pre-paint theme bootstrap in index.html, and on styles for the chart fills that carry a
  # computed colour.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://data-api.ecb.europa.eu; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
}
